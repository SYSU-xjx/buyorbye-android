name: Android CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
      # Package id is platforms;android-37.0 (not android-37); build-tools are not
      # pinned here because AGP 9.3.0 resolves them on its own.
      - name: Install Android SDK platform 37
        run: sdkmanager 'platforms;android-37.0'
      - run: ./gradlew test lint assembleDebug
